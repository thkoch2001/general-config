variables:
  document-css: false
  header-includes: |
    <style>
      html {
        color-scheme: light dark;
      }
      p, h1, h2, h3, h4, h5, h6, small {
        max-width: 48em;
      }

      ul, ol {
        /* account for the 1em -webkit-margin-start for the list icon */
        max-width: 45em;
      }

      ul,ol,dl, p {
        line-height: 1.4;
      }

      body {
        hyphens: auto;
        margin-top: 1em;
        margin-bottom: 1em;
        margin: 0 auto;
        max-width: 36em;
        overflow-wrap: break-word;
        text-rendering: optimizeLegibility;
        font-kerning: normal;
      }
    </style>
